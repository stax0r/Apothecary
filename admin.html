<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silas' Brews - Cellar Control</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <dialog id="login-modal">
        <h2 style="margin-top:0;">Cellar Security</h2>
        <div style="display:flex; flex-direction:column; gap:0.75rem; margin-top:1rem;">
            <input type="email" id="login-email" placeholder="Email">
            <input type="password" id="login-password" placeholder="Password">
            <button class="btn-accent" onclick="window.login()">Enter Cellar</button>
        </div>
    </dialog>

    <div class="container" id="admin-dashboard" style="display:none;">
        <nav class="flex-between" style="margin-bottom: 1.5rem; border-bottom: 1px solid var(--border); padding-bottom: 1rem;">
            <div>
                <h1 style="margin: 0;">Cellar Management</h1>
                <span style="color: var(--text-dim); font-size: 0.875rem;">Raw Materials & Catalog Management</span>
            </div>
            <div style="display: flex; gap: 0.75rem;">
                <a href="index.html"><button>← Storefront</button></a>
                <button onclick="window.logout()">Logout</button>
            </div>
        </nav>

        <div class="grid-2">
            <!-- COLUMN 1: INGREDIENTS STOCK MANAGER -->
            <div style="display: flex; flex-direction: column; gap: 1.25rem;">
                <!-- ATTENTION WARNING TOAST CONTAINER -->
                <div id="attention-container"></div>

                <!-- REGISTER INGREDIENT PANEL -->
                <div class="panel">
                    <h2>Register New Ingredient</h2>
                    <div class="form-row" style="margin-top: 0.85rem;">
                        <div class="form-group" style="flex: 2;">
                            <input type="text" id="ing-name" placeholder="Ingredient Name">
                        </div>
                        <div class="form-group">
                            <input type="number" id="ing-price" step="0.01" placeholder="Price/Unit (g)">
                        </div>
                        <div class="form-group">
                            <input type="number" id="ing-stock" placeholder="Initial Stock">
                        </div>
                        <div class="form-group">
                            <input type="number" id="ing-alert" placeholder="Alert Threshold">
                        </div>
                    </div>
                    <button class="btn-accent" onclick="window.addIngredient()" style="margin-top: 0.75rem; width: 100%;">+ Register Ingredient</button>
                </div>

                <!-- MASTER INGREDIENTS LIST -->
                <div class="panel">
                    <div class="flex-between" style="margin-bottom: 0.75rem;">
                        <h2>Master Ingredients List</h2>
                        <input type="text" id="ing-search" placeholder="Search ingredients..." style="width: 180px;" oninput="window.renderIngredients()">
                    </div>
                    <div id="ingredient-list" style="display:flex; flex-direction:column; gap:0.5rem; max-height: 480px; overflow-y:auto; padding-right: 2px;"></div>
                </div>
            </div>

            <!-- COLUMN 2: BATCHING & RECIPES -->
            <div style="display: flex; flex-direction: column; gap: 1.25rem;">
                <!-- BULK BATCH CALCULATOR -->
                <div class="panel">
                    <h2>Bulk Batch Calculator</h2>
                    <div style="display:flex; gap:0.5rem; margin: 0.85rem 0;">
                        <select id="batch-potion-select" style="flex:2;"></select>
                        <input type="number" id="batch-qty" value="1" min="1" style="width: 80px;">
                        <button class="btn-accent" onclick="window.calculateBatch()">Calculate</button>
                    </div>
                    <div id="batch-results" style="font-family: var(--font-mono); font-size: 0.825rem; background: var(--bg); padding: 0.85rem; border: 1px solid var(--border); border-radius: 6px; white-space: pre-wrap;">Select a potion to evaluate ingredient costs.</div>
                </div>

                <!-- RECIPE EDITOR -->
                <div class="panel">
                    <h2>Create / Edit Potion Recipe</h2>
                    <div style="display:flex; flex-direction:column; gap:0.6rem; margin-top: 0.85rem;">
                        <input type="text" id="potion-name" placeholder="Potion Name">
                        <div class="form-row">
                            <input type="text" id="potion-category" placeholder="Category (e.g. Health)" style="flex:1;">
                            <input type="number" id="potion-price" step="0.01" placeholder="Sale Price (g)" style="flex:1;">
                        </div>
                        <textarea id="potion-desc" placeholder="Potion description or effects..." style="min-height: 50px;"></textarea>

                        <div style="border: 1px solid var(--border); padding: 0.75rem; border-radius: 6px;">
                            <span style="font-size: 0.825rem; font-weight: bold;">Recipe Ingredients</span>
                            <div style="display:flex; gap:0.5rem; margin-top:0.4rem;">
                                <select id="recipe-ing-select" style="flex:2;"></select>
                                <input type="number" id="recipe-ing-qty" value="1" min="1" style="width: 70px;">
                                <button onclick="window.addIngredientToRecipe()">+ Add</button>
                            </div>
                            <ul id="recipe-preview" style="font-size: 0.825rem; padding-left: 1.2rem; margin: 0.5rem 0 0 0;"></ul>
                        </div>

                        <button class="btn-accent" onclick="window.savePotion()">Save Potion to Catalog</button>
                    </div>
                </div>

                <!-- STOREFRONT VISIBILITY CONTROL -->
                <div class="panel">
                    <div class="flex-between" style="margin-bottom: 0.75rem;">
                        <h2>Storefront Visibility Control</h2>
                        <input type="text" id="potion-search" placeholder="Search catalog..." style="width: 180px;" oninput="window.renderPotions()">
                    </div>
                    <div id="admin-potion-list" style="display:flex; flex-direction:column; gap:0.5rem; max-height: 280px; overflow-y:auto; padding-right: 2px;"></div>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="js/admin.js"></script>
</body>
</html>
