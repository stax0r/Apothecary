<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silas' Brews</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div id="toast-container" class="toast-container" popover="manual"></div>

    <div class="container" style="min-height: 90vh; display: flex; flex-direction: column;">
        <div style="flex: 1;">
            <!-- HEADER / NAVIGATION -->
            <nav class="panel-header" style="margin-bottom: 1.5rem;">
                <div>
                    <!-- Removed inline font-size to match Admin page header size -->
                    <h1 style="color: var(--accent);">Silas' Brews</h1>
                    <span style="color: var(--text-dim); font-size: 0.85rem;">Apothecary Catalog &amp; Custom Orders</span>
                </div>
                <div>
                    <a href="admin.html"><button class="btn-edit">📖 Apothecary's Ledger</button></a>
                </div>
            </nav>

            <!-- SEARCH & CATEGORY FILTERS -->
            <div class="panel" style="margin-bottom: 1.5rem;">
                <div class="flex-between gap-md" style="flex-wrap: wrap;">
                    <input type="text" id="store-search" placeholder="Search potions..." style="flex: 1; min-width: 220px;" oninput="window.handleStoreSearch(this.value)">
                    <div id="category-chips-container" class="flex-between gap-sm" style="flex-wrap: wrap;"></div>
                </div>
            </div>

            <!-- CATALOG GRID -->
            <div id="catalog" class="catalog-grid"></div>
        </div>

        <!-- FOOTER -->
        <footer style="text-align: center; margin-top: 3rem; padding-top: 1.5rem; border-top: 1px solid var(--border); color: var(--text-dim); font-size: 0.85rem;">
            Have any questions, suggestions, or feedback?<br>
            Reach out to <strong>stax0r</strong> on Discord.
        </footer>
    </div>

    <!-- FLOATING SATCHEL BUTTON -->
    <button id="floating-satchel" class="floating-satchel-btn hidden" onclick="document.getElementById('satchel-modal').showModal()">
        💼 Satchel (<span id="satchel-count">0</span>)
    </button>

    <!-- SATCHEL / ORDER MODAL -->
    <dialog id="satchel-modal" style="max-width: 520px;">
        <div class="dialog-header">
            <h2>Your Alchemical Satchel</h2>
            <button class="btn-sm" onclick="document.getElementById('satchel-modal').close()">✕</button>
        </div>
        <div class="dialog-body">
            <!-- SATCHEL ITEMS LIST -->
            <div id="satchel-items" style="display: flex; flex-direction: column; gap: 0.5rem; max-height: 240px; overflow-y: auto;"></div>

            <div id="satchel-total" style="font-family: var(--font-mono); font-weight: bold; font-size: 1.1rem; text-align: right; color: var(--accent); margin: 0.5rem 0;"></div>

            <hr style="border: 0; border-top: 1px solid var(--border); margin: 0.5rem 0;">

            <!-- ORDER DISPATCH FORM -->
            <div class="form-group">
                <label>Character Name *</label>
                <input type="text" id="order-client-name" placeholder="e.g. Silas Montclair">
            </div>
            <div class="form-group">
                <label>Discord Handle (Optional)</label>
                <input type="text" id="order-client-discord" placeholder="e.g. stax0r">
            </div>
            <div class="form-group">
                <label>Delivery Location / Notes</label>
                <textarea id="order-notes" rows="2" placeholder="Where should the potions be delivered?"></textarea>
            </div>
            <div style="display: flex; gap: 0.5rem; align-items: center; margin-top: 0.25rem;">
                <input type="checkbox" id="order-location-confirm" style="width: auto;">
                <label for="order-location-confirm" style="font-size: 0.8rem; color: var(--text-dim);">
                    I confirm I am currently at <span id="location-label-text" style="font-weight: bold; color: var(--accent);">the specified location</span>
                </label>
            </div>

            <!-- BUTTON TEXT UPDATED HERE -->
            <button class="btn-accent" style="margin-top: 0.75rem;" onclick="window.submitSatchelOrder()">Leave a letter with your order</button>
        </div>
    </dialog>

    <script type="module" src="js/store.js"></script>
</body>
</html>
