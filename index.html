<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silas' Brews - Apothecary</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <div class="container">
        <nav class="flex-between">
            <div>
                <h1>Silas' Brews</h1>
                <p class="text-dim">Apothecary Storefront</p>
            </div>
            <div style="display: flex; gap: 1rem;">
                <button onclick="document.getElementById('satchel-modal').showModal()">🎒 Satchel (<span id="satchel-count">0</span>)</button>
                <button onclick="document.getElementById('custom-modal').showModal()">📜 Custom Order (<span id="custom-count">0</span>)</button>
                <a href="admin.html"><button>Admin Access</button></a>
            </div>
        </nav>

        <div id="catalog" class="grid-catalog">
            <!-- Potions injected here -->
        </div>
    </div>

    <!-- Satchel Modal -->
    <dialog id="satchel-modal">
        <div class="flex-between">
            <h2>Your Satchel</h2>
            <button onclick="this.closest('dialog').close()">Close</button>
        </div>
        <div id="cart-items" style="margin: 1.5rem 0; display:flex; flex-direction:column; gap:0.5rem;"></div>
        <div id="cart-summary" class="text-dim"></div>
    </dialog>

    <!-- Custom Order Modal -->
    <dialog id="custom-modal">
        <div class="flex-between">
            <h2>Custom Order Request</h2>
            <button onclick="this.closest('dialog').close()">Close</button>
        </div>
        <div id="custom-items" style="margin: 1.5rem 0; display:flex; flex-direction:column; gap:0.5rem;"></div>
        
        <div class="panel" style="margin-top: 1rem;">
            <input type="text" id="client-name" placeholder="Character Name (Required)" style="width: 100%; margin-bottom: 0.5rem;">
            <textarea id="client-message" placeholder="Delivery notes..." style="width: 100%; margin-bottom: 0.5rem;"></textarea>
            <button class="btn-webhook" onclick="window.sendWebhookOrder()">Send Order via Raven (Webhook)</button>
        </div>
    </dialog>

    <script type="module" src="js/store.js"></script>
</body>
</html>
