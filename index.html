<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Silas' Brews - Apothecary Storefront</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div id="status-banner"></div>

<div class="container">
    <header>
        <div class="titles">
            <h1>Silas' Brews</h1>
            <span class="subtitle">Proprietor: Silas Montclair</span>
        </div>
        <div style="display: flex; gap: 10px; align-items: center;">
            <a href="admin.html" class="admin-toggle" style="padding: 6px 14px; text-decoration: none; font-size: 0.85rem; display: inline-block;">Alchemist Login</a>
        </div>
    </header>

    <!-- Customer Satchel Panel -->
    <div id="cart-panel" class="cart-panel">
        <div class="collapse-header" onclick="toggleSection('satchel-collapsible-wrapper', 'satchel-collapse-btn')">
            <h2>Satchel</h2>
            <div style="display: flex; gap: 8px; align-items: center;" onclick="event.stopPropagation();">
                <button onclick="clearCart()" style="background: var(--border); font-size: 0.8rem; padding: 4px 10px;">Empty Satchel</button>
                <button class="collapse-btn" id="satchel-collapse-btn" onclick="toggleSection('satchel-collapsible-wrapper', 'satchel-collapse-btn'); event.stopPropagation();">Hide ▲</button>
            </div>
        </div>
        <div id="satchel-collapsible-wrapper" style="margin-top: 15px;">
            <div id="cart-items-list"></div>
            <div id="cart-summary-area"></div>
        </div>
    </div>

    <!-- Custom Order Panel -->
    <div id="custom-panel" class="custom-panel">
        <div class="collapse-header" onclick="toggleSection('custom-collapsible-wrapper', 'custom-collapse-btn')">
            <h2 style="color: var(--custom-order);">Custom Order</h2>
            <div style="display: flex; gap: 8px; align-items: center;" onclick="event.stopPropagation();">
                <button onclick="clearCustomOrders()" style="background: var(--border); font-size: 0.8rem; padding: 4px 10px;">Empty Custom Orders</button>
                <button class="collapse-btn" id="custom-collapse-btn" onclick="toggleSection('custom-collapsible-wrapper', 'custom-collapse-btn'); event.stopPropagation();">Hide ▲</button>
            </div>
        </div>
        <div id="custom-collapsible-wrapper" style="margin-top: 15px;">
            <div id="custom-items-list"></div>
            <div id="custom-summary-area"></div>
        </div>
    </div>

    <h2>Apothecary Stock</h2>
    <div id="filter-bar" class="filter-bar" style="margin-top: 15px;"></div>
    <div id="catalog" class="catalog-grid"></div>
</div>

<footer>
    <span><strong>OOC:</strong> Whether you have questions, feedback, or just need to get in touch, please feel free to drop me a message on Discord at <code class="copyable-name" title="Click to copy">stax0r</code>. Always happy to help![cite: 1]</span>
</footer>

<!-- JavaScript Entry Point for Customers -->
<script type="module" src="store.js"></script>

</body>
</html>
