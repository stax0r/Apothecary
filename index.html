<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Wandering Apothecary</title>
    <style>
        :root {
            --bg-color: #1a1625;
            --card-bg: #262035;
            --accent: #9d4edd;
            --accent-hover: #7b2cbf;
            --text: #e0d6f6;
            --text-dim: #a093c4;
            --border: #3c3254;
            --gold: #ffb703;
            --success: #2a9d8f;
            --danger: #d90429;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        .container { max-width: 900px; margin: 0 auto; flex: 1; width: 100%; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }

        header .titles { display: flex; flex-direction: column; }
        header .subtitle { font-size: 0.85rem; color: var(--text-dim); font-style: italic; margin-top: 4px; }

        h1, h2, h4 { margin: 0; color: #fff; }

        button {
            background-color: var(--accent);
            color: #fff;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover { background-color: var(--accent-hover); }

        .admin-toggle { background: transparent; border: 1px solid var(--accent); color: var(--accent); }
        .admin-toggle:hover { background: var(--accent); color: #fff; }

        .admin-panel, .login-modal {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 30px;
        }

        .hidden { display: none !important; }

        .form-group { display: flex; gap: 10px; margin-bottom: 15px; flex-wrap: wrap; }

        input, select, textarea {
            background: var(--bg-color);
            border: 1px solid var(--border);
            color: var(--text);
            padding: 8px;
            border-radius: 4px;
            font-family: inherit;
        }

        textarea { width: 100%; resize: vertical; min-height: 60px; }

        /* Filter Pills */
        .filter-bar {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-btn {
            background: var(--card-bg);
            border: 1px solid var(--border);
            color: var(--text-dim);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
        }

        .filter-btn.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        .catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 20px;
        }

        .potion-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            position: relative;
        }

        .potion-card.out-of-stock { opacity: 0.65; border-style: dashed; }

        .category-tag {
            font-size: 0.75rem;
            color: var(--accent);
            text-transform: uppercase;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .potion-desc { font-size: 0.85rem; color: var(--text-dim); font-style: italic; margin: 6px 0 10px 0; }
        .potion-price { font-size: 1.25rem; color: var(--gold); font-weight: bold; margin: 10px 0; }

        .ingredient-list {
            list-style: none;
            padding: 0;
            margin: 0 0 10px 0;
            font-size: 0.9rem;
            color: var(--text-dim);
        }

        .ingredient-list li { padding: 3px 0; }

        .cost-badge {
            font-size: 0.8rem;
            color: #aaa;
            border-top: 1px dashed var(--border);
            padding-top: 8px;
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .profit-text { color: var(--success); font-weight: bold; }
        .loss-text { color: var(--danger); font-weight: bold; }

        .item-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 0;
            border-bottom: 1px solid var(--border);
        }

        .delete-btn { background: var(--danger); padding: 4px 8px; font-size: 0.8rem; }
        .stock-btn { background: var(--success); padding: 4px 8px; font-size: 0.8rem; }
        .stock-btn.off { background: #555; }

        .badge-out {
            background: var(--danger);
            color: #fff;
            font-size: 0.7rem;
            padding: 2px 6px;
            border-radius: 4px;
            text-transform: uppercase;
            font-weight: bold;
            display: inline-block;
            margin-bottom: 5px;
        }

        footer {
            margin-top: 40px;
            padding-top: 15px;
            border-top: 1px solid var(--border);
            text-align: center;
            font-size: 0.8rem;
            color: var(--text-dim);
        }
        
        footer code {
            background: var(--card-bg);
            padding: 2px 6px;
            border-radius: 4px;
            color: var(--accent);
            border: 1px solid var(--border);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="titles">
            <h1>The Wandering Apothecary</h1>
            <span class="subtitle">Proprietor: Loic Sauvage</span>
        </div>
        <button id="auth-btn" class="admin-toggle" onclick="toggleAuthModal()">Alchemist Login</button>
    </header>

    <!-- LOGIN MODAL -->
    <div id="login-modal" class="login-modal hidden">
        <h2>Brew Master Login</h2>
        <div class="form-group" style="margin-top: 10px;">
            <input type="email" id="login-email" placeholder="Email">
            <input type="password" id="login-password" placeholder="Password">
            <button onclick="login()">Login</button>
        </div>
        <p id="login-error" style="color: var(--danger); margin: 0; font-size: 0.85rem;"></p>
    </div>

    <!-- ADMIN MANAGEMENT PANEL -->
    <div id="admin-panel" class="admin-panel hidden">
        <h2>Manage Ingredients</h2>
        <div class="form-group">
            <input type="text" id="ing-name" placeholder="Ingredient Name">
            <input type="number" id="ing-price" placeholder="Price / 1 unit" step="0.01">
            <button onclick="addIngredient()">+ Add Ingredient</button>
        </div>
        <div id="ingredients-list"></div>

        <hr style="border-color: var(--border); margin: 20px 0;">

        <h2>Brew Potion</h2>
        <div class="form-group">
            <input type="text" id="potion-name" placeholder="Potion Name" style="flex: 2;">
            <input type="text" id="potion-category" placeholder="Category (e.g. Restoration)" style="flex: 1;">
            <input type="number" id="potion-sale-price" placeholder="Sale Price" step="0.01" style="flex: 1;">
        </div>
        <div class="form-group">
            <textarea id="potion-desc" placeholder="Potion Description or Magical Effects..."></textarea>
        </div>

        <h4>Recipe Ingredients</h4>
        <div class="form-group">
            <select id="recipe-ing-select"></select>
            <input type="number" id="recipe-ing-qty" placeholder="Qty" value="1" min="1">
            <button onclick="addIngredientToRecipe()">+ Add to Recipe</button>
        </div>

        <ul id="recipe-preview-list"></ul>
        <p>Calculated Base Cost: <strong id="calculated-cost">0</strong> gold</p>

        <button onclick="savePotion()" style="width: 100%; margin-top: 10px;">Create Potion</button>

        <hr style="border-color: var(--border); margin: 20px 0;">

        <h2>Batch Crafting Calculator</h2>
        <div class="form-group" style="margin-top: 10px;">
            <select id="batch-potion-select" style="flex: 2;"></select>
            <input type="number" id="batch-qty" placeholder="Units to brew" value="5" min="1" style="flex: 1;">
            <button onclick="calculateBatch()">Calculate Requirements</button>
        </div>
        <div id="batch-results"></div>
    </div>

    <!-- PUBLIC CATALOG -->
    <h2>Apothecary Stock</h2>
    
    <!-- Category Filter Bar -->
    <div id="filter-bar" class="filter-bar" style="margin-top: 15px;"></div>

    <div id="catalog" class="catalog-grid"></div>
</div>

<footer>
    <span>Inquiries, Custom Orders & Guild Rates: Courier ID <code>stax0r</code> on Discord</span>
</footer>

<!-- Firebase SDKs -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getDatabase, ref, set, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // REPLACE THIS WITH YOUR FIREBASE CONFIG
    const firebaseConfig = {
        apiKey: "AIzaSyC8QXlIWT76AZqttFWzLn4IKRRs3wYAaX8",
        authDomain: "alchemy-shop-dcceb.firebaseapp.com",
        databaseURL: "https://alchemy-shop-dcceb-default-rtdb.firebaseio.com",
        projectId: "alchemy-shop-dcceb",
        storageBucket: "alchemy-shop-dcceb.firebasestorage.app",
        messagingSenderId: "268082568197",
        appId: "1:268082568197:web:31de53d83bece61f0d506c",
        measurementId: "G-H2DY8TMDMN"
};

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getDatabase(app);

    let ingredients = {};
    let potions = {};
    let currentRecipe = [];
    let currentUser = null;
    let selectedCategory = 'All';

    onValue(ref(db, 'ingredients'), (snapshot) => {
        ingredients = snapshot.val() || {};
        render();
    });

    onValue(ref(db, 'potions'), (snapshot) => {
        potions = snapshot.val() || {};
        render();
    });

    onAuthStateChanged(auth, (user) => {
        currentUser = user;
        const authBtn = document.getElementById('auth-btn');
        const adminPanel = document.getElementById('admin-panel');
        const loginModal = document.getElementById('login-modal');

        if (user) {
            authBtn.innerText = "Logout";
            adminPanel.classList.remove('hidden');
            loginModal.classList.add('hidden');
        } else {
            authBtn.innerText = "Alchemist Login";
            adminPanel.classList.add('hidden');
        }
        render();
    });

    window.toggleAuthModal = () => {
        if (currentUser) {
            signOut(auth);
        } else {
            document.getElementById('login-modal').classList.toggle('hidden');
        }
    };

    window.login = () => {
        const email = document.getElementById('login-email').value;
        const pass = document.getElementById('login-password').value;
        const errDiv = document.getElementById('login-error');

        signInWithEmailAndPassword(auth, email, pass)
            .then(() => { errDiv.innerText = ""; })
            .catch(err => { errDiv.innerText = err.message; });
    };

    window.addIngredient = () => {
        const name = document.getElementById('ing-name').value.trim();
        const price = parseFloat(document.getElementById('ing-price').value);

        if (name && !isNaN(price)) {
            const id = Date.now();
            set(ref(db, `ingredients/${id}`), { id, name, price });
            document.getElementById('ing-name').value = '';
            document.getElementById('ing-price').value = '';
        }
    };

    window.updateIngredientPrice = (id, newPrice) => {
        const price = parseFloat(newPrice) || 0;
        set(ref(db, `ingredients/${id}/price`), price);
    };

    window.deleteIngredient = (id) => {
        remove(ref(db, `ingredients/${id}`));
    };

    window.addIngredientToRecipe = () => {
        const select = document.getElementById('recipe-ing-select');
        const qty = parseInt(document.getElementById('recipe-ing-qty').value);
        const ingId = select.value;

        const ing = ingredients[ingId];
        if (ing && qty > 0) {
            currentRecipe.push({ ingredientId: ing.id, name: ing.name, qty });
            renderRecipePreview();
        }
    };

    function renderRecipePreview() {
        const list = document.getElementById('recipe-preview-list');
        list.innerHTML = '';
        let totalCost = 0;

        currentRecipe.forEach(item => {
            const ing = ingredients[item.ingredientId];
            const unitPrice = ing ? ing.price : 0;
            const cost = unitPrice * item.qty;
            totalCost += cost;

            const li = document.createElement('li');
            li.textContent = `${item.qty}x ${item.name} (${cost} gold)`;
            list.appendChild(li);
        });

        document.getElementById('calculated-cost').textContent = totalCost.toFixed(2);
    }

    window.savePotion = () => {
        const name = document.getElementById('potion-name').value.trim();
        const category = document.getElementById('potion-category').value.trim() || 'General';
        const desc = document.getElementById('potion-desc').value.trim();
        const price = parseFloat(document.getElementById('potion-sale-price').value);

        if (name && !isNaN(price) && currentRecipe.length > 0) {
            const id = Date.now();
            set(ref(db, `potions/${id}`), {
                id,
                name,
                category,
                description: desc,
                salePrice: price,
                inStock: true,
                recipe: currentRecipe
            });

            document.getElementById('potion-name').value = '';
            document.getElementById('potion-category').value = '';
            document.getElementById('potion-desc').value = '';
            document.getElementById('potion-sale-price').value = '';
            currentRecipe = [];
            renderRecipePreview();
        }
    };

    window.toggleStock = (id, currentStatus) => {
        set(ref(db, `potions/${id}/inStock`), !currentStatus);
    };

    window.deletePotion = (id) => {
        remove(ref(db, `potions/${id}`));
    };

    window.setCategoryFilter = (cat) => {
        selectedCategory = cat;
        render();
    };

    window.calculateBatch = () => {
        const select = document.getElementById('batch-potion-select');
        const qty = parseInt(document.getElementById('batch-qty').value) || 1;
        const potionId = select.value;
        const potion = potions[potionId];
        const resultsDiv = document.getElementById('batch-results');

        if (!potion || !potion.recipe) return;

        let totalCost = 0;
        let html = `<ul class="ingredient-list" style="margin-top:10px;">`;

        potion.recipe.forEach(r => {
            const ing = ingredients[r.ingredientId];
            const unitPrice = ing ? ing.price : 0;
            const totalQty = r.qty * qty;
            const itemCost = unitPrice * totalQty;
            totalCost += itemCost;
            html += `<li>- ${totalQty}x ${r.name} (${itemCost.toFixed(2)} gold total)</li>`;
        });

        html += `</ul><p style="margin-top:5px;">Total Batch Cost: <strong>${totalCost.toFixed(2)} Gold</strong></p>`;
        resultsDiv.innerHTML = html;
    };

    function calculatePotionCost(recipe) {
        if (!recipe) return 0;
        return recipe.reduce((total, item) => {
            const ing = ingredients[item.ingredientId];
            return total + (ing ? ing.price * item.qty : 0);
        }, 0);
    }

    function render() {
        const ingArray = Object.values(ingredients);
        const potionArray = Object.values(potions);

        // Render ingredients dropdowns
        const select = document.getElementById('recipe-ing-select');
        select.innerHTML = ingArray.map(i => `<option value="${i.id}">${i.name} (${i.price}g)</option>`).join('');

        const batchSelect = document.getElementById('batch-potion-select');
        batchSelect.innerHTML = potionArray.map(p => `<option value="${p.id}">${p.name}</option>`).join('');

        // Render ingredients list in Admin panel
        const ingList = document.getElementById('ingredients-list');
        ingList.innerHTML = ingArray.map(i => `
            <div class="item-row">
                <span><strong>${i.name}</strong></span>
                <div>
                    <input type="number" value="${i.price}" step="0.01" style="width: 70px;" onchange="window.updateIngredientPrice(${i.id}, this.value)"> gold / unit
                    <button class="delete-btn" onclick="window.deleteIngredient(${i.id})">X</button>
                </div>
            </div>
        `).join('');

        // Category Filter Pills
        const categories = ['All', ...new Set(potionArray.map(p => p.category || 'General'))];
        const filterBar = document.getElementById('filter-bar');
        filterBar.innerHTML = categories.map(cat => `
            <button class="filter-btn ${selectedCategory === cat ? 'active' : ''}" onclick="window.setCategoryFilter('${cat}')">${cat}</button>
        `).join('');

        // Render catalog grid
        const catalog = document.getElementById('catalog');
        
        // Filter potions: logged in sees all; guests see ONLY in-stock items
        let visiblePotions = potionArray.filter(p => currentUser ? true : (p.inStock !== false));

        if (selectedCategory !== 'All') {
            visiblePotions = visiblePotions.filter(p => (p.category || 'General') === selectedCategory);
        }

        if (visiblePotions.length === 0) {
            catalog.innerHTML = `<p style="color: var(--text-dim); grid-column: 1/-1;">No items available in this category.</p>`;
            return;
        }

        catalog.innerHTML = visiblePotions.map(p => {
            const cost = calculatePotionCost(p.recipe);
            const profit = p.salePrice - cost;
            const margin = p.salePrice > 0 ? ((profit / p.salePrice) * 100).toFixed(0) : 0;
            const recipeList = p.recipe ? p.recipe.map(r => `<li>- ${r.qty}x ${r.name}</li>`).join('') : '';
            const isStocked = p.inStock !== false;

            return `
                <div class="potion-card ${!isStocked ? 'out-of-stock' : ''}">
                    <div>
                        ${currentUser && !isStocked ? `<span class="badge-out">Out of Stock (Hidden)</span>` : ''}
                        <div class="category-tag">${p.category || 'General'}</div>
                        <h3 style="margin-top: 4px;">${p.name}</h3>
                        ${p.description ? `<div class="potion-desc">${p.description}</div>` : ''}
                        <div class="potion-price">${p.salePrice} Gold</div>
                        <ul class="ingredient-list">
                            ${recipeList}
                        </ul>
                    </div>
                    ${currentUser ? `
                        <div class="cost-badge">
                            <div>Craft Cost: ${cost.toFixed(2)}g</div>
                            <div>Standard Profit: <span class="${profit >= 0 ? 'profit-text' : 'loss-text'}">${profit.toFixed(2)}g (${margin}%)</span></div>
                            <div style="margin-top: 2px; font-style: italic; color: var(--text-dim);">Guild Rate: Discretionary Discount</div>
                            <div style="display: flex; gap: 5px; margin-top: 6px;">
                                <button class="stock-btn ${!isStocked ? 'off' : ''}" onclick="window.toggleStock(${p.id}, ${isStocked})">
                                    ${isStocked ? 'In Stock' : 'Out of Stock'}
                                </button>
                                <button class="delete-btn" onclick="window.deletePotion(${p.id})">Delete</button>
                            </div>
                        </div>
                    ` : ''}
                </div>
            `;
        }).join('');
    }
</script>
</body>
</html>
