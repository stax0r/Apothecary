name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Inject Discord Webhook Secret
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo "❌ ERROR: DISCORD_WEBHOOK_URL secret is missing or empty in GitHub Repository Settings!"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            let file = fs.readFileSync("js/store.js", "utf8");
            file = file.replace("__DISCORD_WEBHOOK_URL__", process.env.DISCORD_WEBHOOK_URL);
            fs.writeFileSync("js/store.js", file);
          '
      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4